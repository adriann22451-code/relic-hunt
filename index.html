m_idle:{n:12,fw:320,fps:10,l:1,fo:38},m_run:{n:6,fw:320,fps:10,l:1,fo:38},m_atk:{n:3,fw:320,fps:10,fo:38}};
const NM={bone:'Tulang Ekor',skull:'Tengkorak',meat:'Daging Monster',eye:'Mata Monster',feather:'Bulu'};
const IM={},tc=document.createElement('canvas'),tx=tc.getContext('2d'),fl=document.createElement('canvas');
let k=1,P,M,FX,TX,DR,INV,over,ot,shake,hs,state='start',last=0;
const act={atk:0,dod:0},joy={on:0,x:0,y:0,bx:0,by:0,id:-1},keys={},ptr={};
const rnd=(a,b)=>a+Math.random()*(b-a),hyp=Math.hypot;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),d=devicePixelRatio||1;cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);k=cv.width/W}
function reset(){P={x:300,y:340,hp:100,st:'idle',f:1,t:0,an:'w_idle',at:0,dcd:0,inv:0,hd:0,cb:0,dd:[1,0],fl:0};
M={x:660,y:300,hp:400,st:'idle',t:0,f:-1,an:'m_idle',at:0,th:0,tb:0,ld:[-1,0],lh:0,dead:0,fl:0,dt:0};
FX=[];TX=[];DR=[];INV={};over=0;ot=0;shake=0;hs=0}
function setAn(o,n){if(o.an!=n){o.an=n;o.at=0}}
function fx(key,x,y,s,fps,n,fw){FX.push({key,x,y,s,t:0,fps:fps||16,n:n||8,fw:fw||64})}
function txt(s,x,y,c){TX.push({s,x,y,c,t:0})}
function drop(key,x,y){DR.push({key,x:Math.min(AR.x+AR.w-30,Math.max(AR.x+30,x)),y:Math.min(AR.y+AR.h-30,Math.max(AR.y+40,y)),t:rnd(0,6)})}
function inp(){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joy.on){x=joy.x;y=joy.y}const l=hyp(x,y);if(l>1){x/=l;y/=l}return[x,y]}
function clampE(o,m){o.x=Math.min(AR.x+AR.w-m,Math.max(AR.x+m,o.x));o.y=Math.min(AR.y+AR.h-8,Math.max(AR.y+50,o.y))}
function upP(dt){if(P.st=='dead')return;P.dcd=Math.max(0,P.dcd-dt);P.inv=Math.max(0,P.inv-dt);P.fl=Math.max(0,P.fl-dt*4);P.t+=dt;P.at+=dt;const[x,y]=inp();
if(P.st=='idle'||P.st=='run'){if(x||y){P.x+=x*200*dt;P.y+=y*200*dt;if(x)P.f=x>0?1:-1;P.st='run';setAn(P,'w_run')}else{P.st='idle';setAn(P,'w_idle')}
if(act.atk){P.st='atk';P.t=0;P.hd=0;P.cb^=1;if(!M.dead&&hyp(M.x-P.x,M.y-P.y)<240)P.f=M.x>P.x?1:-1;setAn(P,P.cb?'w_a2':'w_a1');P.an='';setAn(P,P.cb?'w_a2':'w_a1')}
else if(act.dod&&P.dcd<=0){P.st='dod';P.t=0;P.dcd=.7;P.inv=.3;P.dd=(x||y)?[x,y]:[P.f,0];if(P.dd[0])P.f=P.dd[0]>0?1:-1;setAn(P,'w_run');fx('dust',P.x,P.y-4,1)}}
else if(P.st=='atk'){P.x+=x*50*dt;P.y+=y*50*dt;if(!P.hd&&P.t>=.2){P.hd=1;hit()}if(P.t>=.4)P.st='idle'}
else if(P.st=='dod'){P.x+=P.dd[0]*480*dt;P.y+=P.dd[1]*480*dt;if(P.t>=.22)P.st='idle'}
clampE(P,30)}
function hit(){if(M.dead)return;if(hyp(P.x+P.f*45-M.x,P.y-M.y)<125)mHit(12+(P.cb?6:0))}
function mHit(d){const weak=(P.x-M.x)*M.f<-15&&!M.tb;
if(weak){d*=2;if(++M.th>=3){M.tb=1;shake=14;txt('EKOR PATAH!',M.x,M.y-120,'#ffa43c');drop('bone',M.x-M.f*80,M.y+20)}}
if(M.st=='tired')d*=1.5;M.hp-=d;M.fl=1;fx('boom',M.x+rnd(-30,30),M.y-50,.45,20,8,192);
txt((weak?'TITIK LEMAH! ':'')+(d|0),M.x,M.y-110,weak?'#ffe629':'#fff');shake=Math.max(shake,weak?9:5);hs=weak?.07:.05;
if(M.hp<=0){M.hp=0;M.dead=1;hs=.25;over=1;['skull','meat','eye','feather'].forEach((q,i)=>drop(q,M.x-60+i*40,M.y+50))}}
function hurt(a){if(P.inv>0||P.st=='dead')return;P.hp-=a;P.inv=.6;P.fl=1;shake=12;hs=.08;const l=hyp(P.x-M.x,P.y-M.y)||1;P.x+=(P.x-M.x)/l*40;P.y+=(P.y-M.y)/l*40;
if(P.hp<=0){P.hp=0;P.st='dead';over=2}}
function ms(s){M.st=s;M.t=0;if(s=='atk'){M.f=M.ld[0]>0?1:-1;M.an='';setAn(M,'m_atk')}}
function upM(dt){if(M.dead){M.dt+=dt;return}M.fl=Math.max(0,M.fl-dt*8);if(P.st=='dead'){setAn(M,'m_idle');M.at+=dt;return}
M.t+=dt;M.at+=dt;const dx=P.x-M.x,dy=P.y-M.y,d=hyp(dx,dy)||1,en=M.hp<200,face=()=>{if(Math.abs(dx)>10)M.f=dx>0?1:-1};
switch(M.st){
case'idle':face();setAn(M,'m_idle');if(M.t>.8)ms('chase');break;
case'chase':face();setAn(M,'m_run');M.x+=dx/d*(en?110:85)*dt;M.y+=dy/d*(en?110:85)*dt;if(d<150)ms('tele');break;
case'tele':face();setAn(M,'m_idle');if(M.t>(en?.45:.7)){M.ld=[dx/d,dy/d];M.lh=0;ms('atk')}break;
case'atk':M.x+=M.ld[0]*430*dt;M.y+=M.ld[1]*430*dt;if(!M.lh&&hyp(P.x-M.x,P.y-M.y)<100){M.lh=1;hurt(18)}if(M.t>.35)ms('tired');break;
case'tired':setAn(M,'m_idle');if(M.t>2.2)ms('idle')}
clampE(M,60)}
function update(dt){const real=dt;if(hs>0){hs-=real;dt*=.05}
if(state!='play')return;
if(over)ot+=real;upP(dt);upM(dt);act.atk=act.dod=0;
FX.forEach(f=>f.t+=dt);FX=FX.filter(f=>f.t*f.fps<f.n);TX.forEach(t=>t.t+=dt);TX=TX.filter(t=>t.t<.8);
DR.forEach(d=>d.t+=dt);for(const d of DR.slice()){if(hyp(d.x-P.x,d.y-P.y)<45){INV[d.key]=(INV[d.key]||0)+1;DR.splice(DR.indexOf(d),1);txt('+ '+NM[d.key],P.x,P.y-70,'#9bf59b')}}
shake=Math.max(0,shake-40*real)}
function spr(n,at,x,y,s,flip,col,ca){const a=AN[n];let f=Math.floor(at*a.fps);f=a.l?f%a.n:Math.min(a.n-1,f);let src=IM[n],sx=f*a.fw;
if(ca>0){tc.width=tc.height=a.fw;tx.imageSmoothingEnabled=false;tx.drawImage(src,sx,0,a.fw,a.fw,0,0,a.fw,a.fw);tx.globalCompositeOperation='source-atop';tx.fillStyle=col;tx.globalAlpha=ca;tx.fillRect(0,0,a.fw,a.fw);tx.globalAlpha=1;tx.globalCompositeOperation='source-over';src=tc;sx=0}
ctx.save();ctx.translate(x,y-a.fo*s);if(flip)ctx.scale(-1,1);ctx.drawImage(src,sx,0,a.fw,a.fw,-a.fw*s/2,-a.fw*s/2,a.fw*s,a.fw*s);ctx.restore()}
function T(s,x,y,sz,c,al){ctx.font='700 '+sz+'px system-ui,sans-serif';ctx.textAlign=al||'left';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(s,x,y);ctx.fillStyle=c||'#fff';ctx.fillText(s,x,y)}
function bar(x,y,w,h,v,c){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x-3,y-3,w+6,h+6);ctx.fillStyle=c;ctx.fillRect(x,y,w*Math.max(0,v),h)}
function btn(x,y,r,l,c,a){ctx.globalAlpha=a;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();ctx.globalAlpha=1;T(l,x,y+6,15,'#fff','center')}
function draw(){ctx.setTransform(k,0,0,k,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#47abaa';ctx.fillRect(0,0,W,H);
ctx.save();if(shake>0)ctx.translate(rnd(-1,1)*shake,rnd(-1,1)*shake);ctx.drawImage(fl,0,0);
DR.forEach(d=>{const b=Math.sin(d.t*5)*3,ic=IM[d.key];ctx.drawImage(ic,d.x-24,d.y-24+b,48,48)});
const E=[{y:P.y,o:'p'},{y:M.y,o:'m'}].sort((a,b)=>a.y-b.y);
E.forEach(e=>{const o=e.o=='p'?P:M;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(o.x,o.y,e.o=='p'?26:48,e.o=='p'?9:14,0,0,7);ctx.fill();
if(e.o=='p'){const ca=P.fl>0?P.fl*.7:0;ctx.globalAlpha=P.st=='dod'?.55:1;spr(P.an,P.at,P.x,P.y,.9,P.f<0,P.st=='dead'?'#444':'#f44',P.st=='dead'?.6:ca);ctx.globalAlpha=1}
else{let col='#fff',ca=M.fl;if(M.st=='tired'&&!M.dead){col='#6aa0ff';ca=Math.max(ca,.35)}if(M.st=='tele'&&Math.floor(M.t*20)%2==0){col='#ffd24a';ca=.55}
ctx.globalAlpha=M.dead?Math.max(0,1-Math.max(0,M.dt-1.2)):1;spr(M.an,M.at,M.x,M.y,.85,M.f<0,col,ca);ctx.globalAlpha=1}});
FX.forEach(f=>{const i=IM[f.key],n=Math.min(f.n-1,Math.floor(f.t*f.fps));ctx.drawImage(i,n*f.fw,0,f.fw,f.fw,f.x-f.fw*f.s/2,f.y-f.fw*f.s/2,f.fw*f.s,f.fw*f.s)});
TX.forEach(t=>{ctx.globalAlpha=1-t.t/.8;T(t.s,t.x,t.y-t.t*60,20,t.c,'center');ctx.globalAlpha=1});
ctx.restore();
T('HP',16,30,18);bar(46,16,180,16,P.hp/100,'#3fbf55');
T('Si Penunggu',W/2,26,18,'#fff','center');bar(W/2-190,36,380,14,M.hp/400,'#d62c2c');
let s=M.tb?'Ekor patah!':'Ekor '+Math.min(3,M.th)+'/3';if(M.st=='tired'&&!M.dead)s+='  |  Lelah! Serang sekarang!';else if(!M.th&&!M.tb)s+='  |  Serang dari belakang';T(s,W/2,74,15,'#ffe',  'center');
const iv=Object.keys(INV).map(q=>NM[q]+' x'+INV[q]).join(', ');T(iv?'Material: '+iv:'Material: -',16,58,14,'#fff');
if(state=='play'){if(joy.on){ctx.globalAlpha=.35;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(joy.bx,joy.by,55,0,7);ctx.fill();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.bx+joy.x*55,joy.by+joy.y*55,24,0,7);ctx.fill();ctx.globalAlpha=1}
else{ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(110,430,50,0,7);ctx.fill();ctx.globalAlpha=1;T('geser',110,436,14,'#fff','center')}
btn(840,430,52,'SERANG','#c0392b',.8);btn(740,482,38,'GULING','#2c6fbb',P.dcd>0?.35:.8)}
if(over&&ot>(over==1?1.5:.8)){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,170,W,200);T(over==1?'BERHASIL BERBURU!':'KALAH…',W/2,250,40,over==1?'#ffe629':'#ff6b6b','center');
ctx.fillStyle='#e8b339';ctx.fillRect(W/2-120,285,240,56);T('Berburu lagi',W/2,322,24,'#1a1a1a','center')}
if(state=='start'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);T('RELIC HUNT',W/2,210,64,'#ffe629','center');
T('Patahkan ekor monster, ambil materialnya.',W/2,262,22,'#fff','center');T('Serang dari belakang = titik lemah (damage 2x)',W/2,296,18,'#cfe','center');T('Ketuk layar untuk mulai',W/2,380,26,'#fff','center')}}
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000||0);last=n;update(dt);draw()}
function lp(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=lp(e);if(state=='start'){state='play';return}
if(over&&ot>(over==1?1.5:.8)&&Math.abs(x-W/2)<120&&y>285&&y<341){reset();return}
if(hyp(x-840,y-430)<70)act.atk=1;else if(hyp(x-740,y-482)<55)act.dod=1;
else if(x<480&&!joy.on){joy.on=1;joy.id=e.pointerId;joy.bx=x;joy.by=y;joy.x=joy.y=0}else if(x>=480)act.atk=1});
cv.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId==joy.id){const[x,y]=lp(e);joy.x=Math.max(-1,Math.min(1,(x-joy.bx)/55));joy.y=Math.max(-1,Math.min(1,(y-joy.by)/55))}});
const up=e=>{if(e.pointerId==joy.id){joy.on=0;joy.x=joy.y=0}};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{const q=e.key.toLowerCase();keys[q]=1;if(state=='start'){state='play';return}if(q=='j'||q==' ')act.atk=1;if(q=='k'||q=='shift')act.dod=1;if(q=='r')reset();if(q==' '||q.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('resize',fit);cv.addEventListener('contextmenu',e=>e.preventDefault());
const ks=Object.keys(A);let ld=0;ks.forEach(n=>{const i=new Image();i.onload=()=>{if(++ld==ks.length)init()};i.src=A[n];IM[n]=i});
function init(){fl.width=W;fl.height=H;const f=fl.getContext('2d');f.imageSmoothingEnabled=false;f.fillStyle='#47abaa';f.fillRect(0,0,W,H);
for(let r=0;r<6;r++)for(let c=0;c<12;c++)f.drawImage(IM.tile,64,64,64,64,AR.x+c*64,AR.y+r*64,64,64);f.strokeStyle='#1a3326';f.lineWidth=6;f.strokeRect(AR.x,AR.y,AR.w,AR.h);
fit();reset();requestAnimationFrame(loop)}
</script></body></html>
